# sih_quadruped ros2_control config. Same controller_manager/joint_group_effort_controller
# shape as stock chvmp/champ `ros2` branch champ_gazebo/config/ros_control.yaml
# (docs/champ-research.md #6.1), joint names swapped for ours (identical naming scheme).
#
# PID gains RETUNED from stock (was p:100, i:0.2, d:1.0, i_clamp:2.5 on every joint) -- the
# Gazebo stand test with stock gains oscillated violently and never settled (joint positions
# swinging +/-0.1-0.15 rad between consecutive ~50ms /joint_states samples, undamped) and the
# robot fell over immediately. Root cause: this leg's links are much lighter/shorter than
# stock's (upper_leg 0.11kg/107.5mm vs stock 0.125kg/190.5mm; modeled as a rod pivoting at
# one end, rotational inertia I ~ (1/3)*m*L^2 is roughly 3.6x lower than stock's). A PID
# loop's closed-loop natural frequency scales ~sqrt(P/I) and damping ratio ~D/sqrt(P*I), so
# the same P/D applied to a ~3.6x-lower-inertia link is ~1.9x faster and ~1.9x less damped:
# stock's already-tight tuning becomes underdamped on this leg. Scaled P down ~4x and D up 2x
# (i_clamp reduced to match the smaller P) to restore a comparable damping ratio; see README
# "PID/gait changes" for the stand/walk result with this tuning.
controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 250  # Hz, stock champ_gazebo value

    joint_states_controller:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_effort_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_group_effort_controller:
  ros__parameters:
    use_sim_time: True
    joints:
        - lf_hip_joint
        - lf_upper_leg_joint
        - lf_lower_leg_joint
        - rf_hip_joint
        - rf_upper_leg_joint
        - rf_lower_leg_joint
        - lh_hip_joint
        - lh_upper_leg_joint
        - lh_lower_leg_joint
        - rh_hip_joint
        - rh_upper_leg_joint
        - rh_lower_leg_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    gains:
      lf_hip_joint        : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      lf_upper_leg_joint  : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      lf_lower_leg_joint  : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      rf_hip_joint        : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      rf_upper_leg_joint  : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      rf_lower_leg_joint  : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      lh_hip_joint        : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      lh_upper_leg_joint  : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      lh_lower_leg_joint  : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      rh_hip_joint        : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      rh_upper_leg_joint  : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
      rh_lower_leg_joint  : {p: 8.0, i: 0.0, d: 1.2, i_clamp: 0.5}
